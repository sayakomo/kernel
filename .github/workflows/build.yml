name: komo Kernel

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - '.gitignore'

  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Custom release tag (leave empty for auto: DDMMYYYY)'
        required: false
        default: ''
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  build:
    name: Build Kernel
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    permissions:
      contents: write

    env:
      TZ: Asia/Jakarta
      ARCH: arm64
      SUBARCH: arm64
      KBUILD_BUILD_HOST: xyz
      KBUILD_BUILD_USER: standalone
      USE_CCACHE: '1'
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CLANG_DIR: ${{ github.workspace }}/toolchain/clang
      GCC32_DIR: ${{ github.workspace }}/toolchain/gcc32
      AK3_DIR: ${{ github.workspace }}/AnyKernel3
      KERNEL_DIR: ${{ github.workspace }}/kernel-source
      KERNEL_NAME: komo
      KERNEL_LOCALVERSION: '-komo'
      TARGET_DEVICE: 'Redmi Note 9 Pro (miatoll)'
      DEFCONFIG: vendor/xiaomi/miatoll_defconfig

    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          repository: FoxMiko-Labs/kernel_xiaomi_sm6250
          ref: lineage-23.2
          fetch-depth: 5
          path: kernel-source

      - name: Implant NoMount
        run: |
          cd "$KERNEL_DIR"
          curl https://raw.githubusercontent.com/maxsteeel/nomount/refs/heads/dev/kernel/setup.sh | bash -

      - name: Setup KernelSU-Next
        run: |
          cd "$KERNEL_DIR"
          curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/dev/kernel/setup.sh" | bash

      - name: Verify KernelSU-Next integration
        run: |
          set -euo pipefail
          cd "$KERNEL_DIR"

          echo "===== KERNELSU REPOSITORY ====="

          if [[ ! -d "KernelSU-Next/kernel" ]]; then
            echo "::error::KernelSU-Next/kernel tidak ditemukan"
            exit 1
          fi

          echo "KernelSU-Next/kernel:"
          ls -la KernelSU-Next/kernel

          echo
          echo "===== KERNELSU SOURCE ====="

          find KernelSU-Next/kernel \
            -maxdepth 3 \
            -type f \
            -print | sed -n '1,150p'

          echo
          echo "===== KERNELSU DRIVER LINK ====="

          if [[ -L "drivers/kernelsu" ]]; then
            echo "drivers/kernelsu is a symlink"

            echo "Target:"
            readlink "drivers/kernelsu"

            echo "Resolved:"
            readlink -f "drivers/kernelsu"
          else
            echo "::error::drivers/kernelsu symlink tidak ditemukan"
            ls -la drivers/ | sed -n '1,120p'
            exit 1
          fi

          echo
          echo "===== KERNELSU MAKEFILE ENTRY ====="

          if grep -nF 'obj-$(CONFIG_KSU) += kernelsu/' drivers/Makefile; then
            echo "KernelSU Makefile integration: OK"
          else
            echo "::error::KernelSU belum ditambahkan ke drivers/Makefile"
            exit 1
          fi

          echo
          echo "===== KERNELSU KCONFIG ENTRY ====="

          if grep -nF 'source "drivers/kernelsu/Kconfig"' drivers/Kconfig; then
            echo "KernelSU Kconfig integration: OK"
          else
            echo "::error::KernelSU belum ditambahkan ke drivers/Kconfig"
            exit 1
          fi

          echo
          echo "===== KERNELSU CONFIG REFERENCES ====="

          grep -RniE \
            'CONFIG_KSU|CONFIG_KSU_DEBUG|CONFIG_KSU_LSM' \
            drivers security arch/arm64/configs \
            2>/dev/null \
            | sed -n '1,150p' || true

          echo
          echo "===== KERNELSU STATUS ====="

          cd KernelSU-Next

          echo "Commit:"
          git rev-parse --short=12 HEAD

          echo "Branch:"
          git branch --show-current || true

          echo "Description:"
          git describe --always --dirty --tags || true

          cd "$KERNEL_DIR"

          echo
          echo "===== KERNELSU INTEGRATION: OK ====="

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
          bc bison build-essential ca-certificates cpio curl \
          flex git jq libelf-dev libssl-dev \
          python3 python3-requests unzip xz-utils zstd ccache lz4 \
          rsync flex dwarves make libdw-dev pkg-config device-tree-compiler

          echo "ccache location:"
          command -v ccache

          echo "ccache version:"
          ccache --version

      - name: Restore FoxeClang cache
        id: cache-clang
        uses: actions/cache@v4
        with:
          path: ${{ env.CLANG_DIR }}
          key: foxe-clang-v23.0-20260822

      - name: Download and extract FoxeClang
        if: steps.cache-clang.outputs.cache-hit != 'true'
        run: |
          mkdir -p "$CLANG_DIR"
          curl -fSL --retry 3 -o foxe-clang.tar.zst \
            "https://github.com/FoxMiko-Labs/FoxeClang/releases/download/v23.0-20260822/FoxeClang-23.0-20260822.tar.zst"
          tar --use-compress-program=zstd -xf foxe-clang.tar.zst \
            -C "$CLANG_DIR" --strip-components=1
          rm -f foxe-clang.tar.zst

      - name: Restore FoxGCC ARM32 cache
        id: cache-gcc32
        uses: actions/cache@v4
        with:
          path: ${{ env.GCC32_DIR }}
          key: fox-gcc32-v17.0-20260822

      - name: Download and extract FoxGCC ARM32
        if: steps.cache-gcc32.outputs.cache-hit != 'true'
        run: |
          mkdir -p "$GCC32_DIR"
          curl -fSL --retry 3 -o fox-gcc32.tar.zst \
            "https://github.com/FoxMiko-Labs/Fox-GCC/releases/download/v17.0-20260822/FoxGCC-17-arm-20260822.tar.zst"
          tar --use-compress-program=zstd -xf fox-gcc32.tar.zst \
            -C "$GCC32_DIR" --strip-components=1
          rm -f fox-gcc32.tar.zst

      - name: Validate toolchains
        run: |
          set -e
          if [[ ! -x "$CLANG_DIR/bin/clang" ]]; then
            echo "::error::clang not found at $CLANG_DIR/bin/clang"
            exit 1
          fi
          echo "Clang  : $("$CLANG_DIR/bin/clang" --version | head -n1)"

          GCC32_BIN=$(find "$GCC32_DIR" -name "arm-eabi-gcc" -type f | head -1)
          if [[ -z "$GCC32_BIN" ]]; then
            echo "::warning::arm-eabi-gcc not found in $GCC32_DIR"
          else
            echo "GCC32  : $GCC32_BIN"
          fi

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-miatoll-${{ github.sha }}
          restore-keys: |
            ccache-miatoll-
            ccache-

      - name: Configure ccache
        run: |
          ccache --max-size=5G
          ccache --zero-stats

      - name: Resolve release tag
        run: |
          CUSTOM_TAG="${{ github.event.inputs.release_tag }}"
          DATE_TAG=$(TZ=Asia/Jakarta date +%d%m%Y)

          if [[ -n "$CUSTOM_TAG" ]]; then
            RELEASE_TAG="$CUSTOM_TAG"
          else
            RELEASE_TAG="$DATE_TAG"
          fi

          RELEASE_URL="https://github.com/${{ github.repository }}/releases/tag/${RELEASE_TAG}"

          echo "DATE_TAG=${DATE_TAG}"       >> "$GITHUB_ENV"
          echo "RELEASE_TAG=${RELEASE_TAG}" >> "$GITHUB_ENV"
          echo "RELEASE_URL=${RELEASE_URL}" >> "$GITHUB_ENV"

          echo "Date tag    : ${DATE_TAG}"
          echo "Release tag : ${RELEASE_TAG}"
          echo "Release URL : ${RELEASE_URL}"

      - name: Prepare miatoll defconfig
        run: |
          set -euo pipefail
          cd "$KERNEL_DIR"

          DEFCONFIG_FILE="arch/arm64/configs/$DEFCONFIG"

          if [[ ! -f "$DEFCONFIG_FILE" ]]; then
            echo "::error::Defconfig tidak ditemukan: $DEFCONFIG_FILE"
            exit 1
          fi

          echo "===== ORIGINAL MIATOLL DEFCONFIG ====="
          grep -nE \
            '^(CONFIG_LOCALVERSION=|CONFIG_LOCALVERSION_AUTO=|CONFIG_LOCALVERSION_BRANCH_SHA=|# CONFIG_LOCALVERSION_AUTO is not set|# CONFIG_LOCALVERSION_BRANCH_SHA is not set)' \
            "$DEFCONFIG_FILE" || true

          sed -i \
            -e '/^CONFIG_LOCALVERSION=/d' \
            -e '/^CONFIG_LOCALVERSION_AUTO=/d' \
            -e '/^# CONFIG_LOCALVERSION_AUTO is not set$/d' \
            -e '/^CONFIG_LOCALVERSION_BRANCH_SHA=/d' \
            -e '/^# CONFIG_LOCALVERSION_BRANCH_SHA is not set$/d' \
            "$DEFCONFIG_FILE"

          cat >> "$DEFCONFIG_FILE" <<'EOF'

          CONFIG_LOCALVERSION=""
          # CONFIG_LOCALVERSION_AUTO is not set
          # CONFIG_LOCALVERSION_BRANCH_SHA is not set
          EOF

          echo "===== FINAL MIATOLL DEFCONFIG ====="
          grep -nE \
            '^(CONFIG_LOCALVERSION=|CONFIG_LOCALVERSION_AUTO=|CONFIG_LOCALVERSION_BRANCH_SHA=|# CONFIG_LOCALVERSION_AUTO is not set|# CONFIG_LOCALVERSION_BRANCH_SHA is not set)' \
            "$DEFCONFIG_FILE"

          [[ "$(grep -c '^CONFIG_LOCALVERSION=' "$DEFCONFIG_FILE" || true)" -eq 1 ]] || { echo "::error::CONFIG_LOCALVERSION duplicate/invalid"; exit 1; }
          [[ "$(grep -cE '^(CONFIG_LOCALVERSION_AUTO=|# CONFIG_LOCALVERSION_AUTO is not set)' "$DEFCONFIG_FILE" || true)" -eq 1 ]] || { echo "::error::CONFIG_LOCALVERSION_AUTO duplicate/invalid"; exit 1; }
          [[ "$(grep -cE '^(CONFIG_LOCALVERSION_BRANCH_SHA=|# CONFIG_LOCALVERSION_BRANCH_SHA is not set)' "$DEFCONFIG_FILE" || true)" -eq 1 ]] || { echo "::error::CONFIG_LOCALVERSION_BRANCH_SHA duplicate/invalid"; exit 1; }

      - name: Configure kernel
        run: |
          set -euo pipefail
          cd "$KERNEL_DIR"

          echo "===== RUNNING DEFCONFIG ====="

          make \
            O="$KERNEL_DIR/out" \
            ARCH="$ARCH" \
            "$DEFCONFIG"

          echo
          echo "===== KERNELSU CONFIG AFTER DEFCONFIG ====="

          grep -E \
            '^(CONFIG_KSU=|CONFIG_KSU_DEBUG=|CONFIG_KSU_LSM=|# CONFIG_KSU)' \
            out/.config || true

          echo
          echo "===== KERNELSU KCONFIG ====="

          grep -RniE \
            '^(config KSU|menuconfig KSU)' \
            drivers/kernelsu \
            2>/dev/null || true

      - name: Build kernel
        run: |
          echo "Device         : $TARGET_DEVICE"
          echo "Defconfig      : $DEFCONFIG"
          echo "Kernel name    : $KERNEL_NAME"
          echo "Local version  : $KERNEL_LOCALVERSION"
          echo "CPU cores      : $(nproc --all)"

          if [[ ! -f "$KERNEL_DIR/buildci.sh" ]]; then
            echo "::error::buildci.sh tidak ditemukan di $KERNEL_DIR"
            echo "--- Isi direktori kernel-source ---"
            ls -la "$KERNEL_DIR"
            exit 1
          fi

          # Catat waktu mulai build
          echo "BUILD_START=$(date +%s)" >> "$GITHUB_ENV"

          chmod +x "$KERNEL_DIR/buildci.sh"
          cd "$KERNEL_DIR"

          echo
          echo "===== KERNEL VERSION SOURCE ====="
          grep -nE '^(VERSION|PATCHLEVEL|SUBLEVEL|EXTRAVERSION)' Makefile || true

          echo
          echo "===== GIT ====="
          git rev-parse --short=8 HEAD
          git describe --dirty --always --tags || true

          echo
          echo "===== BUILD ====="
          LOCALVERSION="$KERNEL_LOCALVERSION" bash buildci.sh

          # Catat waktu selesai build (hanya kompilasi, sebelum packaging)
          echo "BUILD_END=$(date +%s)" >> "$GITHUB_ENV"

      - name: Verify KernelSU-Next in final config
        run: |
          cd "$KERNEL_DIR"

          echo "===== FINAL KSU CONFIG ====="
          grep -E \
            '^(CONFIG_KSU|CONFIG_KSU_DEBUG|CONFIG_KSU_LSM)' \
            out/.config || true

          echo
          echo "===== KSU DRIVER ====="
          find drivers/kernelsu -maxdepth 2 -type f -print 2>/dev/null || true
      - name: Verify kernel output
        run: |
          IMAGE="$KERNEL_DIR/out/arch/arm64/boot/Image.gz"

          if [[ ! -f "$IMAGE" ]]; then
            echo "::error::Kernel image not found - build may have failed silently"
            exit 1
          fi

          echo "Kernel image : $(du -sh "$IMAGE" | cut -f1)"

          KERNEL_RELEASE="$(
            make -s --no-print-directory \
              -C "$KERNEL_DIR" \
              O="$KERNEL_DIR/out" \
              kernelrelease \
              ARCH="$ARCH" \
              LOCALVERSION="$KERNEL_LOCALVERSION"
          )"

          KERNEL_RELEASE="$(echo "$KERNEL_RELEASE" | tail -n 1 | tr -d '\r')"

          if [[ -z "$KERNEL_RELEASE" ]]; then
            echo "::error::Failed to determine kernel release"
            exit 1
          fi

          echo "Kernel release: $KERNEL_RELEASE"

          echo
          echo "===== FINAL CONFIG LOCALVERSION ====="
          grep -E '^(CONFIG_LOCALVERSION=|CONFIG_LOCALVERSION_AUTO=|CONFIG_LOCALVERSION_BRANCH_SHA=)' \
            "$KERNEL_DIR/out/.config" || true

          echo
          echo "===== FINAL KERNEL RELEASE FILE ====="
          cat "$KERNEL_DIR/out/include/config/kernel.release" 2>/dev/null || true

          echo
          echo "===== VERSION FILES ====="
          find "$KERNEL_DIR/out" -maxdepth 3 -type f \
            \( -name '.scmversion' -o -name 'kernel.release' \) \
            -print -exec sh -c 'echo "--- $1"; cat "$1"' _ {} \; 2>/dev/null || true

          echo "KERNEL_RELEASE=$KERNEL_RELEASE" >> "$GITHUB_ENV"

      - name: Clone AnyKernel3
        run: |
          git clone --depth=1 \
            https://github.com/Michikoextv2/AnyKernel3-miatoll.git \
            -b staging "$AK3_DIR"

      - name: Package kernel ZIP
        run: |
          ZIP_NAME="${KERNEL_NAME}-${DATE_TAG}.zip"
          ZIP_PATH="${GITHUB_WORKSPACE}/${ZIP_NAME}"

          echo "ZIP_NAME=${ZIP_NAME}" >> "$GITHUB_ENV"
          echo "ZIP_PATH=${ZIP_PATH}" >> "$GITHUB_ENV"

          for img in Image.gz dtb.img dtbo.img; do
            src="$KERNEL_DIR/out/arch/arm64/boot/$img"
            if [[ -f "$src" ]]; then
              cp "$src" "$AK3_DIR"
              echo "Copied : $img"
            else
              echo "Skip   : $img (not found)"
            fi
          done

          (
            cd "$AK3_DIR"
            zip -r9 "$ZIP_PATH" . \
              -x "*.git*" \
              -x "README.md" \
              -x "*.github*"
          )

          ZIP_SIZE=$(du -sh "$ZIP_PATH" | cut -f1)
          echo "ZIP_SIZE=${ZIP_SIZE}" >> "$GITHUB_ENV"
          echo "Packaged : ${ZIP_NAME} (${ZIP_SIZE})"

      - name: Generate release notes
        run: |
          COMMIT_LOG=$(git -C "$KERNEL_DIR" log -5 \
            --pretty=format:"- \`%h\` %s (%an)" --no-merges)

          # Hitung durasi build untuk release notes
          BUILD_DURATION_SEC=$(( BUILD_END - BUILD_START ))
          BUILD_DURATION="${BUILD_DURATION_SEC}s"
          if (( BUILD_DURATION_SEC >= 60 )); then
            BUILD_DURATION="$(( BUILD_DURATION_SEC / 60 ))m $(( BUILD_DURATION_SEC % 60 ))s"
          fi

          cat > "${GITHUB_WORKSPACE}/release_notes.md" << EOF
          ## ${KERNEL_NAME}-${DATE_TAG}

          ### Device
          - **Target:** ${TARGET_DEVICE}

          ### Last 5 Commits

          ${COMMIT_LOG}

          ### Build Info

          | Key       | Value                    |
          |-----------|--------------------------|
          | Branch    | \`lineage-23.2\`         |
          | Runner    | \`ubuntu-24.04\`         |
          | Clang     | FoxeClang v23.0-20260822 |
          | GCC ARM32 | FoxGCC v17.0-20260822    |
          | Defconfig | \`${DEFCONFIG}\`         |
          | Duration  | ${BUILD_DURATION}        |
          | Size      | ${ZIP_SIZE}              |

          ---
          EOF

          echo "BUILD_DURATION=${BUILD_DURATION}" >> "$GITHUB_ENV"

      - name: Upload kernel ZIP as artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ZIP_NAME }}
          path: ${{ env.ZIP_PATH }}
          retention-days: 7

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: '${{ env.KERNEL_NAME }}-${{ env.DATE_TAG }}'
          body_path: ${{ github.workspace }}/release_notes.md
          files: ${{ env.ZIP_PATH }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Show ccache stats
        if: always()
        run: |
          if command -v ccache >/dev/null 2>&1; then
            ccache --show-stats
          else
            echo "::warning::ccache is not installed"
          fi
